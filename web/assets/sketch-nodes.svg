<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Rough sketch: Shader Editor showing image textures feeding the UnityToon node group and the Material Output">
  <style>
    .s { fill: none; stroke: #c9834f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .h { fill: rgba(240,127,42,.14); }
    .m { fill: rgba(79,196,168,.18); }
    .t { font: 700 12px/1 "Nunito", system-ui, sans-serif; fill: #9a8a80; }
    .tt { font: 800 11px/1 "Nunito", system-ui, sans-serif; fill: #ad5410; letter-spacing: .06em; }
    .w { fill: none; stroke: #c9834f; stroke-width: 2.5; opacity: .8; }
  </style>
  <rect x="20" y="20" width="600" height="320" rx="10" class="s"/>
  <line x1="20" y1="46" x2="620" y2="46" class="s"/>
  <text x="34" y="37" class="t">Shader Editor · Object · Body (lilToon → Toon node group)</text>
  <!-- image texture nodes -->
  <g>
    <rect x="44" y="70" width="128" height="62" rx="6" class="s"/><rect x="44" y="70" width="128" height="18" class="h"/>
    <text x="52" y="83" class="t">Image Texture</text><text x="52" y="106" class="t">body_albedo.png</text><text x="52" y="124" class="t">Color ●</text>
    <rect x="44" y="150" width="128" height="62" rx="6" class="s"/><rect x="44" y="150" width="128" height="18" class="h"/>
    <text x="52" y="163" class="t">Image Texture</text><text x="52" y="186" class="t">body_shadow.png</text><text x="52" y="204" class="t">Color ●</text>
    <rect x="44" y="230" width="128" height="62" rx="6" class="s"/><rect x="44" y="230" width="128" height="18" class="h"/>
    <text x="52" y="243" class="t">Image Texture</text><text x="52" y="266" class="t">body_matcap.png</text><text x="52" y="284" class="t">Color ●</text>
  </g>
  <!-- group node -->
  <rect x="250" y="70" width="170" height="228" rx="6" class="s"/><rect x="250" y="70" width="170" height="18" class="m"/>
  <text x="258" y="83" class="t">UnityToon (node group)</text>
  <g class="t">
    <text x="258" y="110">● Base Color</text>
    <text x="258" y="132">● Shadow Color</text>
    <text x="258" y="154">  Shadow Border  0.50</text>
    <text x="258" y="176">  Shadow Blur    0.10</text>
    <text x="258" y="198">● MatCap</text>
    <text x="258" y="220">  MatCap Blend   Add</text>
    <text x="258" y="242">  Rim Light</text>
    <text x="258" y="264">  Emission</text>
    <text x="258" y="286">  Alpha</text>
    <text x="372" y="110">BSDF ●</text>
  </g>
  <!-- output -->
  <rect x="490" y="70" width="112" height="62" rx="6" class="s"/><rect x="490" y="70" width="112" height="18" class="h"/>
  <text x="498" y="83" class="t">Material Output</text><text x="498" y="110" class="t">● Surface</text>
  <!-- wires -->
  <path d="M172 124 C 215 124, 215 106, 250 106" class="w"/>
  <path d="M172 204 C 215 204, 215 128, 250 128" class="w"/>
  <path d="M172 284 C 215 284, 215 194, 250 194" class="w"/>
  <path d="M420 106 C 455 106, 455 106, 490 106" class="w"/>
  <text x="250" y="322" class="t">custom properties: unity_material_guid · unity_shader_* · unity_normalized</text>
  <text x="34" y="336" class="tt">ROUGH · REPLACE WITH SCREENSHOT</text>
</svg>
