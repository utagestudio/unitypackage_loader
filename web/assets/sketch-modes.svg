<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Rough sketch: the same avatar head rendered with the Toon node group on the left and Principled BSDF on the right">
  <style>
    .s { fill: none; stroke: #c9834f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .h { fill: rgba(240,127,42,.14); }
    .h2 { fill: rgba(240,127,42,.32); }
    .t { font: 700 12px/1 "Nunito", system-ui, sans-serif; fill: #9a8a80; }
    .tb { font: 800 13px/1 "Nunito", system-ui, sans-serif; fill: #9a8a80; }
    .tt { font: 800 11px/1 "Nunito", system-ui, sans-serif; fill: #ad5410; letter-spacing: .06em; }
    .d { stroke-dasharray: 5 6; }
  </style>
  <!-- left: toon -->
  <rect x="20" y="20" width="292" height="320" rx="10" class="s"/>
  <rect x="20" y="20" width="292" height="26" class="h"/>
  <text x="32" y="38" class="tb">Toon (node group) · EEVEE</text>
  <g transform="translate(166 180)">
    <circle r="70" class="s"/>
    <!-- hard-edged shadow -->
    <path d="M-10 -69 A70 70 0 0 0 -10 69 L-10 40 A50 50 0 0 1 -10 -40 Z" class="h2"/>
    <path d="M-10 -69 L-10 69" class="s"/>
    <path d="M-52 -46 q52 -40 104 0 q-10 -30 -52 -34 q-42 4 -52 34z" class="h"/>
    <circle cx="-22" cy="4" r="6" class="s"/><circle cx="22" cy="4" r="6" class="s"/>
    <path d="M-10 32 q10 6 20 0" class="s"/>
  </g>
  <text x="32" y="300" class="t">flat color · hard shadow edge · MatCap</text>
  <text x="32" y="318" class="t">rim light · outline</text>
  <!-- right: principled -->
  <rect x="328" y="20" width="292" height="320" rx="10" class="s"/>
  <rect x="328" y="20" width="292" height="26" class="h"/>
  <text x="340" y="38" class="tb">Principled BSDF · Cycles or EEVEE</text>
  <g transform="translate(474 180)">
    <circle r="70" class="s"/>
    <!-- soft gradient shadow -->
    <path d="M-10 -69 A70 70 0 0 0 -10 69 Z" class="h" opacity=".6"/>
    <path d="M-40 -57 A70 70 0 0 0 -40 57 Z" class="h" opacity=".8"/>
    <path d="M-52 -46 q52 -40 104 0 q-10 -30 -52 -34 q-42 4 -52 34z" class="h"/>
    <circle cx="-22" cy="4" r="6" class="s"/><circle cx="22" cy="4" r="6" class="s"/>
    <path d="M-10 32 q10 6 20 0" class="s"/>
    <ellipse cx="28" cy="-30" rx="10" ry="6" class="s d"/>
  </g>
  <text x="340" y="300" class="t">smooth falloff · normal map · metallic / roughness</text>
  <text x="340" y="318" class="t">specular highlight</text>
  <text x="34" y="336" class="tt">ROUGH · REPLACE WITH SCREENSHOT</text>
</svg>
