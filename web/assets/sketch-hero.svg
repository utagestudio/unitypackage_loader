<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Rough sketch: Blender viewport with an imported avatar and the Unity Package sidebar tab">
  <style>
    .s { fill: none; stroke: #c9834f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .h { fill: rgba(240,127,42,.14); }
    .t { font: 700 12px/1 "Nunito", system-ui, sans-serif; fill: #9a8a80; }
    .tt { font: 800 11px/1 "Nunito", system-ui, sans-serif; fill: #ad5410; letter-spacing: .06em; }
    .d { stroke-dasharray: 5 6; }
  </style>
  <!-- window chrome -->
  <rect x="20" y="20" width="600" height="320" rx="10" class="s"/>
  <line x1="20" y1="46" x2="620" y2="46" class="s"/>
  <text x="34" y="37" class="t">File  Edit  Render  Window  Help        Layout  Modeling  Shading</text>
  <!-- viewport -->
  <rect x="34" y="60" width="380" height="266" rx="6" class="s d"/>
  <text x="46" y="80" class="t">3D Viewport · Material Preview</text>
  <!-- floor grid -->
  <path d="M60 300 L390 300 M80 270 L370 270 M110 240 L340 240 M140 210 L310 210" class="s" opacity=".35"/>
  <!-- avatar silhouette -->
  <g class="s">
    <circle cx="224" cy="128" r="26"/>
    <path d="M198 122 q-6 -34 26 -40 q32 6 26 40"/>
    <path d="M196 132 q-10 20 -4 44 M252 132 q10 20 4 44"/>
    <path d="M224 154 v14"/>
    <path d="M186 172 q38 -14 76 0 l10 70 h-96z"/>
    <path d="M186 172 q-18 24 -14 66 M262 172 q18 24 14 66"/>
    <path d="M200 242 q24 6 48 0 l4 54 h-56z"/>
  </g>
  <path d="M186 172 q38 -14 76 0 l10 70 h-96z" class="h"/>
  <text x="150" y="316" class="t">avatar imported with toon materials</text>
  <!-- sidebar -->
  <rect x="430" y="60" width="176" height="266" rx="6" class="s"/>
  <rect x="430" y="60" width="176" height="24" class="h"/>
  <text x="440" y="77" class="t">Unity Package</text>
  <text x="440" y="106" class="t">Last import</text>
  <text x="440" y="126" class="t">Objects        7</text>
  <text x="440" y="144" class="t">Materials     12</text>
  <text x="440" y="162" class="t">Textures      20</text>
  <line x1="440" y1="176" x2="596" y2="176" class="s" opacity=".5"/>
  <text x="440" y="196" class="t">Materials</text>
  <g class="t"><text x="440" y="216">✓ Body   lilToon</text><text x="440" y="234">✓ Face   lilToon</text><text x="440" y="252">✓ Hair   lilToon</text><text x="440" y="270">! Extra  generic</text></g>
  <line x1="440" y1="284" x2="596" y2="284" class="s" opacity=".5"/>
  <text x="440" y="304" class="t">Tools  ▸ Rebuild in Another Mode</text>
  <!-- tab strip -->
  <rect x="606" y="60" width="14" height="70" rx="3" class="h"/>
  <!-- rough tag -->
  <text x="34" y="336" class="tt">ROUGH · REPLACE WITH SCREENSHOT</text>
</svg>
